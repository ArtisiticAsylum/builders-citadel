  <rect width="1200" height="675" fill="#fdeedc"/>
  <rect x="40" y="34" width="150" height="34" rx="17" fill="#c9563f"/>
  <text x="62" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">The game layer</text>
  <g>
    <polygon points="1105,72 1065,62 1105,52 1145,62" fill="#f2c94c"/>
    <polygon points="1065,62 1105,72 1105,100 1065,90" fill="#d4a72c"/>
    <polygon points="1145,62 1105,72 1105,100 1145,90" fill="#b3881e"/>
  </g>
  <rect x="90" y="100" width="700" height="470" rx="18" fill="#1c1f2b" stroke="#e0c9a8" stroke-width="2"/>
  <text x="120" y="146" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#e8e9f0">The Citadel Game</text>
  <text x="120" y="170" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#9aa0b5">Season 1 - your first weeks in the Citadel</text>
  <circle cx="740" cy="150" r="26" fill="#f5c542"/>
  <text x="740" y="150" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#4a3800" text-anchor="middle">3</text>
  <text x="740" y="164" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="bold" fill="#4a3800" text-anchor="middle">LEVEL</text>
  <rect x="120" y="190" width="540" height="16" rx="8" fill="#0d0f16"/>
  <rect x="120" y="190" width="330" height="16" rx="8" fill="#f5c542"/>
  <text x="672" y="203" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa0b5">280 XP</text>
  <rect x="120" y="226" width="646" height="120" rx="10" fill="#232738"/>
  <rect x="120" y="226" width="646" height="120" rx="10" fill="none" stroke="#2c3145" stroke-width="1"/>
  <rect x="120" y="316" width="646" height="30" fill="#1c2b22"/>
  <rect x="188" y="270" width="30" height="46" fill="#e07b39" rx="2"/>
  <rect x="196" y="278" width="6" height="9" fill="#ffe9a8"/><rect x="208" y="278" width="6" height="9" fill="#141826"/>
  <rect x="196" y="296" width="6" height="9" fill="#ffe9a8"/><rect x="208" y="296" width="6" height="9" fill="#ffe9a8"/>
  <rect x="268" y="244" width="38" height="72" fill="#7b68ee" rx="2"/>
  <line x1="287" y1="244" x2="287" y2="226" stroke="#dddddd" stroke-width="2"/>
  <polygon points="287,226 305,231 287,236" fill="#f5c542"/>
  <rect x="276" y="252" width="6" height="9" fill="#ffe9a8"/><rect x="288" y="252" width="6" height="9" fill="#ffe9a8"/>
  <rect x="276" y="270" width="6" height="9" fill="#141826"/><rect x="288" y="270" width="6" height="9" fill="#ffe9a8"/>
  <rect x="356" y="282" width="26" height="34" fill="#4a90d9" rx="2"/>
  <rect x="440" y="262" width="32" height="54" fill="#2e9e6b" rx="2"/>
  <rect x="448" y="270" width="6" height="9" fill="#ffe9a8"/><rect x="460" y="270" width="6" height="9" fill="#ffe9a8"/>
  <circle cx="700" cy="248" r="12" fill="#f7f3d8" opacity="0.9"/>
  <text x="132" y="342" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9aa0b5">4 buildings so far. A settlement begins.</text>
  <rect x="120" y="366" width="646" height="60" rx="10" fill="#232738"/>
  <circle cx="146" cy="396" r="7" fill="#e07b39"/>
  <text x="164" y="392" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#e8e9f0">The Gate</text>
  <text x="700" y="392" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa0b5" text-anchor="end">3/4</text>
  <rect x="120" y="416" width="646" height="6" fill="#0d0f16"/>
  <rect x="120" y="416" width="484" height="6" fill="#e07b39"/>
  <rect x="120" y="440" width="646" height="76" rx="10" fill="#241b3d" stroke="#6d3df0" stroke-width="1"/>
  <text x="140" y="470" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#e8e9f0">Run SETUP.md to the end</text>
  <rect x="360" y="456" width="46" height="18" rx="5" fill="#6d3df0"/>
  <text x="383" y="469" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">BOSS</text>
  <text x="140" y="494" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa0b5">The interview builds your whole Citadel - one question at a time.</text>
  <text x="646" y="470" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#f5c542" text-anchor="end">+100 XP</text>
  <rect x="666" y="480" width="76" height="26" rx="8" fill="#f5c542"/>
  <text x="704" y="498" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#3a2c00" text-anchor="middle">Done!</text>
  <text x="120" y="548" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa0b5">Positive-only: nothing ever goes red, shrinks, or shames. Missed days simply do not score.</text>
  <g font-family="DejaVu Sans, sans-serif">
    <path d="M792 300 Q850 290 890 296" fill="none" stroke="#b0543c" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
    <text x="900" y="288" font-size="17" font-weight="bold" fill="#6e4a2c">Your city grows with</text>
    <text x="900" y="310" font-size="17" font-weight="bold" fill="#6e4a2c">every finished quest</text>
    <text x="900" y="332" font-size="13" fill="#8a6a48">bosses raise landmarks</text>
    <path d="M792 480 Q850 490 890 484" fill="none" stroke="#b0543c" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
    <text x="900" y="466" font-size="17" font-weight="bold" fill="#6e4a2c">The bridge to the vault</text>
    <text x="900" y="490" font-size="13" fill="#8a6a48">Copy progress report, paste to</text>
    <text x="900" y="508" font-size="13" fill="#8a6a48">your AI - it updates the real</text>
    <text x="900" y="526" font-size="13" fill="#8a6a48">Action-Tracker, ask-first as always</text>
  </g>
  <text x="90" y="622" font-family="DejaVu Sans, sans-serif" font-size="15" font-style="italic" fill="#6e4a2c">your first weeks as quest lines - XP, streaks, badges, and a city that only ever grows</text>
</svg>
